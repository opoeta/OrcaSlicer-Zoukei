# Opcional (NAO instalado): faz a propria impressora ativar o carretel do Spoolman do canal IFS em uso,
# mesmo sem o Orca aberto. Fonte: lane_data/lane<N>.spool_id (gravado pelo HelixScreen).
# Instalar: copiar para a pasta de config do Klipper (ex.: printer_data/config/ifs_spoolman.cfg), incluir com
# [include ifs_spoolman.cfg] no printer.cfg e chamar IFS_SET_ACTIVE_SPOOL CHAN=<1-4> no gcode de troca de
# ferramenta/filamento do ZMOD (ou depois do IFS_LOAD). Requer [spoolman] no Moonraker e [save_variables].
# O mapa canal -> spool_id vive no banco do Moonraker; para a macro funcionar sem rede, o Orca/HelixScreen
# deve copiar o id para uma variavel salva: SAVE_VARIABLE VARIABLE=ifs_spool_<N> VALUE=<id> (ver sync-flashforge.md).
[gcode_macro IFS_SET_ACTIVE_SPOOL]
description: Define o carretel ativo do Spoolman a partir do canal IFS (CHAN=1..4)
gcode:
  {% set chan = params.CHAN|default(0)|int %}
  {% set svv = printer.save_variables.variables %}
  {% set sid = svv['ifs_spool_' ~ chan]|default(0)|int %}
  {% if chan >= 1 and chan <= 4 and sid > 0 %}
    SET_ACTIVE_SPOOL ID={sid}
  {% else %}
    CLEAR_ACTIVE_SPOOL
  {% endif %}
